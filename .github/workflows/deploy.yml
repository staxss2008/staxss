name: Build and Deploy Hugo
on:
  push:
    branches: [ main ]

# 这一段权限声明是解决403的关键！
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download PaperMod theme zip
        run: |
          mkdir -p themes
          cd themes
          wget -O papermod.zip https://github.com/adityatelange/hugo-PaperMod/archive/refs/heads/master.zip
          unzip -q papermod.zip
          mv hugo-PaperMod-master PaperMod
          rm papermod.zip

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
