name: Build and Deploy Hugo
on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download PaperMod theme zip
        run: |
          mkdir -p themes
          cd themes
          wget -O papermod.zip https://github.com/adityatelange/hugo-PaperMod/archive/refs/heads/master.zip
          unzip -q papermod.zip
          mv hugo-PaperMod-master PaperMod
          rm papermod.zip

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
